# =============================================================================
# DEV override: hot-reload, verbose logs, pgAdmin.
# Combined with docker-compose.yml by `install.sh dev` / `manage.sh`.
#
# All host ports bind to 127.0.0.1. A dev stack runs with the database manager
# reachable, pgAdmin without a master password and debug-level logs — none of
# that should be offered to the local network.
# =============================================================================

services:
  odoo:
    # Run from the bind-mounted core source (./core -> /opt/odoo/core).
    # --dev=reload,qweb,xml -> auto-reload Python + templates on change.
    # `werkzeug` is deliberately NOT enabled: it turns every traceback page
    # into an interactive Python console (remote code execution).
    command:
      - python3
      - /opt/odoo/core/odoo-bin
      - -c
      - /etc/odoo/odoo.conf
      - --dev=reload,qweb,xml
      - --log-level=debug
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_LONGPOLLING_PORT:-8072}:8072"
    # Addons writable in dev for scaffolding/tooling that writes back.
    volumes:
      - ./custom_addons:/mnt/extra-addons:rw
    # Local inference server (ollama) runs natively on the host, not in a
    # container, so there is no container name to address — reach it through the
    # host gateway at http://host.docker.internal:11434.
    # The extra_hosts entry is a no-op on Docker Desktop/OrbStack and required on
    # Linux, where that hostname does not exist by default.
    #
    # If ollama is ever containerised, prefer addressing it by service name on a
    # shared network: a host-gateway URL is ambiguous once a native instance and
    # a published container both answer on 11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    # Expose Postgres to the host (loopback only) for external DB tools.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  pgadmin:
    # Pinned: `latest` would make the stack irreproducible across machines.
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9.16}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@odoo.local}
      # File-backed so the password stays out of `docker inspect`.
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Explicit: under `no-new-privileges` the entrypoint cannot bind a
      # privileged port and silently falls back to 8080, which leaves a :80
      # mapping pointing at nothing.
      PGADMIN_LISTEN_PORT: "8080"
    secrets:
      - pgadmin_password
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - odoo_net
    healthcheck:
      # Without this pgAdmin reports "Up" even when it is listening on a port
      # nothing is mapped to.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen(
              "http://localhost:8080/misc/ping", timeout=5).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  pgadmin_password:
    file: ./secrets/pgadmin_password

volumes:
  pgadmin_data:
