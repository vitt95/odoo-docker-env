# =============================================================================
# The four boundary checks of decision D24 (`ai/04-architettura.md` §6.4).
#
# They run on every push and pull request, from the first commit of the product,
# because that is the whole point of D24: the checks cost little now and grow
# superlinearly expensive once violations exist and have to be cleaned up first.
#
# No dependency installation step by design — the checks are stdlib only, so
# there is nothing here that can rot or go offline.
# =============================================================================
name: Boundaries

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Boundary checks
        run: python3 tools/arch/run.py --no-colour

      - name: Tests of the checks themselves
        # A check that has never been observed to fail is indistinguishable from
        # a check that cannot fail.
        run: python3 -m unittest discover -s tools/arch/tests -t .

      - name: Contract — pure zone
        # No Odoo, no database, no network: the whole of part 2 is verifiable
        # here, which is why it was built without the ORM.
        run: python3 tools/pure/run.py

      - name: Derived JSON Schema is current
        run: python3 tools/dsl/emit_schema.py

      - name: Foundational corpus against the contract
        run: python3 ai/corpus/verifica_contratto.py

      - name: Dictionary and catalogue against the corpus
        # Coverage, the phase A fast path and the budget derivation. Fails on a wrong
        # determination rate above the declared tolerance: when the fast path is wrong
        # it does not produce an error, it produces a different plausible entity.
        run: python3 ai/corpus/misura_catalogo.py
