# AIDA — LoRA a 16 bit su Qwen3.5-2B, l'obiettivo ambizioso di ai/19 §5.
#
# Il perche' di ogni valore sta in ai/18 §4 e ai/21 §6; qui c'e' solo la forma. La
# ricetta e' un file e non una sessione di terminale perche' una corsa che nessuno sa
# ripetere non e' una misura.
#
#   axolotl preprocess tools/finetuning/ricette/aida-2b-lora.yml
#   axolotl train      tools/finetuning/ricette/aida-2b-lora.yml
#
# Il 2B legge il prompt a 1 087 gettoni al secondo — quattro volte e mezza il 9B — e
# gira su qualunque cosa, anche un mini-PC senza scheda video. Ma sul banco non si e'
# fermato: ha scritto 1 200 gettoni di seguito, ed e' la taglia dove il fine tuning
# puo' non bastare. Non lo escludiamo: costa undici dollari saperlo invece di
# discuterne (ai/19 §5).

base_model: Qwen/Qwen3.5-2B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# --- LoRA (ai/18 §3, §4) -----------------------------------------------------
adapter: lora
lora_r: 32                  # grammatica, non stile: 16 non basta, 64 comincia a
                            # mandare a memoria
lora_alpha: 64              # = 2r
lora_dropout: 0.05          # poco: il dataset e' grande e pulito
lora_target_linear: true    # q,k,v,o,gate,up,down. Le matrici del blocco di
                            # alimentazione sono dove il modello tiene *come si
                            # scrive* una struttura, ed e' cio' che stiamo insegnando
peft_use_rslora: true       # scala stabile ai ranghi alti
load_in_8bit: false
load_in_4bit: false         # 16 bit: chi pubblica i pesi di Qwen 3.5 sconsiglia
                            # QLoRA a 4 bit su questa famiglia (ai/19 §10)

# --- Dati --------------------------------------------------------------------
# Prodotti da tools/finetuning/genera_dataset.py. Non stanno nel repository: sono un
# artefatto, e si rigenerano dall'atlante con lo stesso seme. Il rapporto di
# copertura invece si commette, ed e' il pezzo che si legge prima di spendere.
datasets:
  - path: data/aida_train.jsonl
    type: chat_template
    field_messages: messages
chat_template: qwen3

test_datasets:
  - path: data/aida_val.jsonl
    type: chat_template
    field_messages: messages
    split: train

# La perdita **solo sulla risposta**. Il prompt e' per meta' il nostro stesso
# messaggio di sistema: farci imparare sopra sarebbe spendere l'addestramento a
# memorizzare un testo che abbiamo scritto noi.
train_on_inputs: false

# Misurato sul dataset vero, non scelto a tavolino: mediana 3 044 gettoni, 99°
# percentile 4 658, massimo 6 075. Gli esempi oltre 6 144 il generatore li **scarta**,
# non li tronca — un esempio troncato non insegna una risposta piu' corta, insegna una
# risposta che finisce a meta'.
sequence_len: 6144

# Spento di proposito. I nostri esempi sono lunghi: ne entra uno per finestra e il
# guadagno e' quasi nullo. In cambio, se la maschera di attenzione sbaglia su un caso
# limite, due cataloghi diversi finiscono nella stessa finestra e il modello impara a
# leggere il catalogo sbagliato — che e' esattamente il difetto per cui esiste tutto
# questo lavoro.
sample_packing: false
pad_to_sequence_len: false

# --- La corsa ----------------------------------------------------------------
num_epochs: 2               # a tre passate comincia a mandare a memoria
micro_batch_size: 2
gradient_accumulation_steps: 16   # lotto efficace 32: lotti piccoli su esempi lunghi
                                  # danno gradienti rumorosi, e l'accumulo costa nulla
learning_rate: 0.0001       # 1e-4 e non 2e-4: rango alto, e l'obiettivo e' la
                            # precisione, non l'adattamento rapido
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_torch_fused
weight_decay: 0.01
max_grad_norm: 1.0
bf16: auto
gradient_checkpointing: true      # e' cio' che rende sostenibili i 6k gettoni
flash_attention: true

# --- Cosa si salva, e quando -------------------------------------------------
# Otto punti di controllo. Su ognuno si misura **fuori da axolotl** con
# misura_accuratezza.py: la perdita scende anche mentre il modello impara a scrivere
# JSON plausibile e sbagliato, quindi il numero vero e' la percentuale di envelope
# validi e di riferimenti presenti nel catalogo di quel caso (ai/21 §8).
output_dir: ./out/aida-2b-lora
saves_per_epoch: 4
evals_per_epoch: 4
logging_steps: 10
save_total_limit: 8

# Una corsa che non si ripete non e' una misura.
seed: 20260806
