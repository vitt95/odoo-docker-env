# =============================================================================
# BANCO DI PROVA DEL CARICO — override per la prova di isolamento (D27).
#
# Non e' una terza modalita' di esercizio: e' la sola configurazione in cui la
# prova di `05` §7.1 significa qualcosa. Il meccanismo di RA3 e' la saturazione
# del pool prefork, e la modalita' `dev` gira **senza `--workers`**: li' i turni
# e le richieste ERP sono thread dello stesso processo, il pool non esiste, e
# qualunque numero si misuri parla del server di sviluppo e non del rischio.
#
#   docker compose --project-name odoo --env-file .env \
#     -f docker-compose.yml -f docker-compose.load.yml up -d
#
# oppure, che e' la stessa cosa senza errori di battitura:
#
#   ./manage.sh loadtest <db> [utenti]
#
# Quattro worker e quattro processi cron sono i valori raccomandati da `05` §6:
# `--max-cron-threads` da 2 a 4 e' la mitigazione di RE1, cioe' il dispatcher che
# affama i cron di business. Con due, il dispatcher ne occuperebbe la meta'.
# =============================================================================

services:
  odoo:
    command:
      - python3
      - /opt/odoo/core/odoo-bin
      - -c
      - /etc/odoo/odoo.conf
      - --workers=${ODOO_WORKERS:-4}
      - --max-cron-threads=4
      - --log-level=warn
      - --limit-time-real=120
      - --limit-request=65536
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      # La latenza del fornitore, simulata (D97). Senza questa variabile la coda
      # si svuota istantaneamente e la prova misura una coda vuota.
      NLI_LOAD_HARNESS: ${NLI_LOAD_HARNESS:-1.5}
    volumes:
      - ./custom_addons:/mnt/extra-addons:ro
